name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Pin the runner: setup-python has no Python 3.8/3.9 builds for Ubuntu 26.04,
    # which `ubuntu-latest` now resolves to. All 3.8-3.12 builds exist for 24.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile router_config_xray.py
      - name: Built-in self test
        run: python router_config_xray.py --self-test
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo smoke test
        run: |
          # --demo scans the vulnerable decoy config, so exit 2 (findings) is the
          # expected, successful outcome. Anything else is a real failure.
          code=0
          python router_config_xray.py --demo --no-color --quiet || code=$?
          test "$code" -eq 0 || test "$code" -eq 2
          code=0
          python router_config_xray.py --demo --no-color --redact --outdir /tmp/xray-evidence || code=$?
          test "$code" -eq 0 || test "$code" -eq 2
          test -f /tmp/xray-evidence/report.json
          test -f /tmp/xray-evidence/report.html
          test -f /tmp/xray-evidence/report.md
