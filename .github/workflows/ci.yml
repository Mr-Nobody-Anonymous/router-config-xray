name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile router_config_xray.py
      - name: Built-in self test
        run: python router_config_xray.py --self-test
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo smoke test
        run: |
          python router_config_xray.py --demo --no-color --quiet
          python router_config_xray.py --demo --no-color --redact --outdir /tmp/xray-evidence
          test -f /tmp/xray-evidence/report.json
          test -f /tmp/xray-evidence/report.html
          test -f /tmp/xray-evidence/report.md
